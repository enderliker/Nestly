name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d92bbbb03544f480ed5c7ba4b54020e4ed2c4f65 # 1.89.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binaries
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          LIBOPUS_NO_PKG: "1"
          LIBOPUS_STATIC: "1"
        run: cargo build --release --target "$TARGET" --bin nestly-supervisor --bin nestly-edge --bin nestly-mod-music --bin nestly-mod-ops
      - name: Test
        run: cargo test --workspace
      - name: Test the launcher
        working-directory: js
        run: node --test test/*.test.mjs
      - name: Generate manifest and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node scripts/release-manifest.mjs \
            --dir "target/$TARGET/release" \
            --out dist \
            --version "${VERSION#v}" \
            --target "$TARGET"
      - name: Sign the manifest
        env:
          NESTLY_SIGNING_KEY: ${{ secrets.NESTLY_SIGNING_KEY }}
          RSBOT_SIGNING_KEY: ${{ secrets.RSBOT_SIGNING_KEY }}
        run: node scripts/sign-manifest.mjs dist/nestly-manifest.json
      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/nestly-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: false