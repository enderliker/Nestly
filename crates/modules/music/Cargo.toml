[package]
name = "nestly-mod-music"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
[[bin]]
name = "nestly-mod-music"
path = "src/main.rs"
[dependencies]
async-trait = "0.1"
nestly-core = { path = "../../nestly-core" }
nestly-module-sdk = { path = "../../nestly-module-sdk" }
reqwest = { workspace = true }
serde_json.workspace = true
songbird = { version = "0.6", default-features = false, features = ["driver", "builtin-queue", "rustls", "tws"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "isomp4", "mkv", "vorbis", "flac", "wav", "pcm"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
rustls.workspace = true
tempfile.workspace = true
twilight-gateway.workspace = true
twilight-model.workspace = true

[lints]
workspace = true
