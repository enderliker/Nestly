[package]
name = "nestly-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "nestly-supervisor"

[[bin]]
name = "nestly-supervisor"
path = "src/main.rs"

[[bin]]
name = "nestly-fake-module"
path = "src/bin/nestly-fake-module.rs"

[[bin]]
name = "nestly-fake-edge"
path = "src/bin/nestly-fake-edge.rs"

[dependencies]
clap.workspace = true
futures-util.workspace = true
nestly-core = { path = "../nestly-core" }
nestly-ipc = { path = "../nestly-ipc" }
nestly-sys = { path = "../nestly-sys" }
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
