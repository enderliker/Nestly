[package]
name = "rsbot-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "rsbot-supervisor"

[[bin]]
name = "rsbot-supervisor"
path = "src/main.rs"

[[bin]]
name = "rsbot-fake-module"
path = "src/bin/rsbot-fake-module.rs"

[[bin]]
name = "rsbot-fake-edge"
path = "src/bin/rsbot-fake-edge.rs"

[dependencies]
clap.workspace = true
futures-util.workspace = true
rand.workspace = true
reqwest.workspace = true
rsbot-core = { path = "../rsbot-core" }
rsbot-ipc = { path = "../rsbot-ipc" }
rsbot-sys = { path = "../rsbot-sys" }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
