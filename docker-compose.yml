services:
  nestly:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NESTLY_CONFIG: /home/container/nestly.toml
      NESTLY_INSTALL_DIR: /home/container/nestlybins
      NESTLY_STATE_DIR: /home/container/nestly-state
      RSBOT_CONFIG: /home/container/nestly.toml
      RSBOT_INSTALL_DIR: /home/container/nestlybins
      RSBOT_STATE_DIR: /home/container/nestly-state
    volumes:
      - ./nestly.toml:/home/container/nestly.toml:ro
      - nestly-state:/home/container/nestly-state
      - nestly-bins:/home/container/nestlybins
    stop_grace_period: 10s

volumes:
  nestly-state:
  nestly-bins: